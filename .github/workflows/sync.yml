name: sync-ofac-sdn

# Daily automated mirror of the official OFAC SDN CSV. GitHub-hosted runners egress from
# US addresses, so treasury.gov (which TLS-rejects Cloudflare Workers egress with HTTP 525)
# is reachable here. The worker consumes raw.githubusercontent.com as its fallback source.
on:
  schedule:
    - cron: "10 0 * * *" # 00:10 UTC daily — before the worker's 03:30 UTC nightly screening refresh
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official sdn.csv
        run: |
          curl -fsSL --max-time 120 -o sdn.csv https://www.treasury.gov/ofac/downloads/sdn.csv
          grep -q 'Digital Currency Address' sdn.csv || { echo "source layout changed"; exit 1; }
      - name: Commit if changed
        run: |
          git config user.name "ofac-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sdn.csv
          if git diff --cached --quiet; then echo "no changes since last sync"; else
            git commit -m "sdn.csv sync $(date -u +%F)"
            git push
          fi
